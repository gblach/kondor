[package]
name = "kondor"
version = "0.2.0"
edition = "2024"
description = "Cleans build artifacts from software projects, including nested projects."
readme = "README.md"
repository = "https://github.com/gblach/kondor"
license = "GPL-3.0-or-later"
keywords = ["artifacts", "clean", "cli", "disk-space", "kondo"]
categories = ["command-line-utilities", "development-tools", "filesystem"]
include = ["/LICENSE", "/README.md", "/src/", "/tests/"]

[dependencies]
argp = "0.4"
console = "0.16"
globset = "0.4"
rustix = { version = "1", features = ["fs", "linux_5_11"] }

[dev-dependencies]
tempfile = "3"

[workspace]
members = ["xtask"]

[profile.release]
lto = "thin"
strip = "symbols"
